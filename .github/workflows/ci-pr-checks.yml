name: "CI - PR Checks"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@v0.0.7
        with:
          text: ${{ github.event.pull_request.title }}

  body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -qE '^(seps|drafts)/'; then
            echo "is_sep=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_sep=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate PR body template shape and checklist
        if: steps.changes.outputs.is_sep == 'true'
        uses: zendev-lab/zendev/actions/validate-body@v0.0.7
        with:
          body: ${{ github.event.pull_request.body }}
          require-checklist: "true"

      - name: PR body OK (non-SEP PR)
        if: steps.changes.outputs.is_sep == 'false'
        run: echo "Non-SEP PR — body checklist not required."
