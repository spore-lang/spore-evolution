name: "CI - PR Checks"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check PR title
        uses: zrr1999/zendev/actions/validate-title@v0.0.5
        with:
          text: ${{ github.event.pull_request.title }}

  body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect new proposal documents
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --no-renames --diff-filter=A --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
          if echo "$CHANGED" | grep -qE '^(seps|drafts)/'; then
            echo "is_new_sep=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_sep=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate PR body checklist (new SEP PRs only)
        if: steps.changes.outputs.is_new_sep == 'true'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          REQUIRED_CHECKBOXES = [
              "- [x] I opened or linked a public Discussion or Issue for the pitch before submitting this draft SEP.",
              "- [x] I linked the canonical discussion thread.",
              "- [x] I used the correct SEP template for this proposal type.",
              "- [x] I updated front matter metadata and required sections.",
          ]

          payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = (payload.get("pull_request") or {}).get("body") or ""
          missing = [item for item in REQUIRED_CHECKBOXES if item not in body]

          if missing:
              print("Pull request body is missing required checked items:\n", file=sys.stderr)
              for item in missing:
                  print(f"- {item}", file=sys.stderr)
              raise SystemExit(1)

          print("Pull request body checklist looks good.")
          PY

      - name: PR body OK (no new SEP)
        if: steps.changes.outputs.is_new_sep == 'false'
        run: echo "No new SEP — pitch checklist not required."
